# Publishes the Vite build to the gh-pages branch.
#
# GitHub Pages for this repo is the legacy source (branch gh-pages, path /),
# custom domain versa.roymarketing.ca. The github-pages environment only
# allows deployments from gh-pages, so actions/deploy-pages from main is
# rejected ("Branch main is not allowed to deploy to github-pages").
# Publishing the dist folder onto gh-pages is what actually updates the site.
# Les pull requests et les autres branches ne publient pas : le déclencheur
# push est limité à main, et le job refuse toute ref qui n'est pas main
# (y compris un workflow_dispatch lancé depuis la branche de PR).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Vide tant que le formulaire Zoho Canada n'existe pas.
          # Variable de dépôt (Settings > Secrets and variables > Actions > Variables).
          # https://forms.zohopublic.ca/<portail>/form/<lien>/formperma/<jeton>
          VITE_RECRUTEMENT_FORM_URL: ${{ vars.VITE_RECRUTEMENT_FORM_URL }}

      - name: Publish dist to gh-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          work=$(mktemp -d)
          git worktree add --detach "$work" origin/gh-pages
          find "$work" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a dist/. "$work/"
          touch "$work/.nojekyll"
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "No site changes to publish"
            exit 0
          fi
          git -C "$work" commit -m "Publish ${GITHUB_SHA}"
          git -C "$work" push origin HEAD:gh-pages
