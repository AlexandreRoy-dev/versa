#
# nginx vhost for versa.codesurmesure.ca -> Next.js on 127.0.0.1:43127
#
# Install as /etc/nginx/sites-available/versa.codesurmesure.ca and symlink into
# sites-enabled. Run certbot afterwards; it rewrites this file to add the TLS
# server block and the port 80 redirect.
#
server {
    listen 80;
    listen [::]:80;
    server_name versa.codesurmesure.ca;

    access_log /var/log/nginx/versa.access.log;
    error_log  /var/log/nginx/versa.error.log;

    # Prototype only: keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;

    # Hashed build assets are immutable, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:43127;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:43127;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
