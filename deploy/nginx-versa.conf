#
# nginx vhost for versa.codesurmesure.ca -> Next.js on 127.0.0.1:43127
#
# Install as /etc/nginx/sites-available/versa.codesurmesure.ca and symlink into
# sites-enabled. Run certbot afterwards; it rewrites this file to add the TLS
# server block and the port 80 redirect.
#
server {
    listen 80;
    listen [::]:80;
    server_name versa.codesurmesure.ca;

    access_log /var/log/nginx/versa.access.log;
    error_log  /var/log/nginx/versa.error.log;

    # Prototype only: keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;

    # Next already sends immutable cache headers for its own hashed assets
    # under /_next/static, so everything can go through one location.
    location / {
        proxy_pass http://127.0.0.1:43127;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
